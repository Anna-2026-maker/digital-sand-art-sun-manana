<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MAÑANA · 作品管理</title><link rel="stylesheet" href="./admin.css"><script src="./exhibition-config.js" defer></script><script src="./admin.js" defer></script></head>
<body><header><div><small>MAÑANA / EXHIBITION</small><h1>日出沙画 · 作品管理</h1></div><button id="logout" hidden>退出登录</button></header>
<main><section id="loginPanel" class="panel"><h2>管理员登录</h2><form id="loginForm"><label>管理密码<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">进入作品库</button></form></section>
<section id="dashboard" hidden><div class="stats"><article><small>作品总数</small><strong id="total">—</strong></article><article><small>今日提交</small><strong id="today">—</strong></article><article><small>打印操作次数</small><strong id="prints">—</strong></article></div><div class="actions"><h2>作品列表 · 每 5 秒刷新</h2><button id="refresh">刷新</button></div><div id="gallery" class="gallery"></div><div class="pagination"><button id="previous">上一页</button><span id="pageLabel">第 1 页</span><button id="next">下一页</button></div></section><p id="message" role="status"></p></main>
<div id="viewer" class="viewer" hidden><div class="viewer-card"><button id="closeViewer" class="close" aria-label="关闭">×</button><img id="largeImage" alt="作品大图"><div id="viewerMeta"></div><div class="viewer-actions"><button id="printImage">打印明信片</button><button id="downloadImage">下载打印图</button><button id="deleteImage" class="danger">删除作品</button></div></div></div>
</body></html>
